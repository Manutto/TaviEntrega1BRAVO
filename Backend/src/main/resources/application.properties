spring.application.name=Backend
server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mundus_entrega1}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

spring.sql.init.mode=always
spring.mvc.problemdetails.enabled=true

sea.guias.url-pagina=${SEA_GUIAS_URL_PAGINA:https://www.sea.gob.cl/guias-para-la-evaluacion-de-impacto-ambiental}
sea.guias.url-excel=${SEA_GUIAS_URL_EXCEL:}

sea.pdf.max-bytes=${SEA_PDF_MAX_BYTES:31457280}
sea.pdf.max-paginas=${SEA_PDF_MAX_PAGINAS:600}

sea.flujo.directorio=${GUIAS_DIRECTORIO:../output/guias}
sea.vector.python=${VECTOR_PYTHON:../.venv-vector/Scripts/python.exe}
sea.vector.script=${VECTOR_SCRIPT:../Preparador/json_to_vector.py}
sea.vector.directorio=${VECTOR_DIRECTORIO:../output/guias/vectores}
sea.vector.cache=${VECTOR_CACHE:../output/modelos/huggingface}
sea.vector.modelo=${VECTOR_MODELO:intfloat/multilingual-e5-base}
sea.vector.timeout-segundos=${VECTOR_TIMEOUT_SEGUNDOS:7200}

asistente.url=${ASISTENTE_URL:http://127.0.0.1:8002}
asistente.timeout-segundos=${ASISTENTE_HTTP_TIMEOUT_SEGUNDOS:210}
